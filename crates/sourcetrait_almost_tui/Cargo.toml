[package]
name = "sourcetrait_almost_tui"
version = "0.0.0-1"
edition = "2024"
description = "talmost: the interactive terminal chat over sourcetrait_almost_lib"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_almost"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "almost", "tui", "chat", "olmo"]

[[bin]]
name = "talmost"
path = "src/main.rs"

[features]
attn-profile = ["sourcetrait_almost_lib/attn-profile"]
cuda = ["sourcetrait_almost_lib/cuda"]
flash-attn = ["cuda", "sourcetrait_almost_lib/flash-attn"]

[dependencies]
clap.workspace = true
ratatui.workspace = true
sourcetrait_almost_lib.workspace = true
