[package]
name = "sourcetrait_almost_cli"
version = "0.0.0-2"
edition = "2024"
description = "almost: the command-line interface over sourcetrait_almost_lib"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_almost"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "almost", "cli", "olmo"]

[[bin]]
name = "almost"
path = "src/main.rs"

[features]
cuda = ["sourcetrait_almost_lib/cuda"]

[dependencies]
clap.workspace = true
sourcetrait_almost_lib.workspace = true
