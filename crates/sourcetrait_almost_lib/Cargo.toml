[package]
name = "sourcetrait_almost_lib"
version = "0.0.0-3"
edition = "2024"
description = "The almost engine: Olmo 3 7B Instruct port and program library on candle"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_almost"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "almost", "lib", "olmo"]

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
flash-attn = ["cuda", "dep:candle-flash-attn"]

[dependencies]
candle-core.workspace = true
candle-flash-attn = { workspace = true, optional = true }
candle-nn.workspace = true
candle-transformers.workspace = true
hf-hub.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
tokenizers.workspace = true
