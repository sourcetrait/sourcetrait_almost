[package]
name = "sourcetrait_almost_heat"
version = "0.0.0-3"
edition = "2024"
description = "Independent burn-based Olmo 3 parity oracle for almost"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_almost"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "almost", "heat", "olmo", "burn"]

[[bin]]
name = "heat"
path = "src/main.rs"

[features]
cuda = ["burn/cuda", "burn/autotune"]
train = ["burn/autodiff", "dep:tokenizers"]
# Training smoke target: cuda WITHOUT autotune - the head-matmul
# autotune's benchmark churn at ~22 GiB residency kills the cubecl
# allocator (measured); default kernel selection trades speed for a
# bounded pool.
train-cuda = ["train", "burn/cuda"]

[dependencies]
burn.workspace = true
clap.workspace = true
half.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
tokenizers = { workspace = true, optional = true }
