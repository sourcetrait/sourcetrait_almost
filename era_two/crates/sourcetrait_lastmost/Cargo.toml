[package]
name = "sourcetrait_lastmost"
version = "0.0.0-4"
edition = "2024"
description = "lastmost: baselining of the original model and its original tools"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_almost"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "almost", "lastmost", "baseline"]

[[bin]]
name = "lastmost"
path = "src/main.rs"

[features]
cuda = ["sourcetrait_lib_almost/cuda"]
flash-attn = ["cuda", "sourcetrait_lib_almost/flash-attn"]

[dependencies]
clap.workspace = true
safetensors.workspace = true
serde_json.workspace = true
snafu.workspace = true
sourcetrait_lib_almost.workspace = true
