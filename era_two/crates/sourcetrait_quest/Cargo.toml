[package]
name = "sourcetrait_quest"
version = "0.0.0-2"
edition = "2024"
description = "quest: the flagship smart command"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_quest"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "quest"]

[[bin]]
name = "quest"
path = "src/main.rs"

[features]
cuda = ["sourcetrait_lib_quest/cuda"]
flash-attn = ["cuda", "sourcetrait_lib_quest/flash-attn"]

[dependencies]
clap.workspace = true
snafu.workspace = true
sourcetrait_lib_quest.workspace = true
