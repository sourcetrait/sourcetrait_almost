[package]
name = "sourcetrait_quest_compat"
version = "0.0.0-3"
edition = "2024"
description = "Generic Olmo 3 7B Instruct baseline on candle (compat reference for quest)"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_quest"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "quest", "compat", "olmo"]

[[bin]]
name = "refquest"
path = "src/main.rs"

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
clap.workspace = true
hf-hub.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
tokenizers.workspace = true
