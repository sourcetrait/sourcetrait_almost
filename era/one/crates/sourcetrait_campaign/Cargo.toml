[package]
name = "sourcetrait_campaign"
version = "0.0.0-2"
edition = "2024"
description = "camp: the interactive terminal chat over sourcetrait_quest_lib"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_quest"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "quest", "camp", "chat", "olmo"]

[[bin]]
name = "camp"
path = "src/main.rs"

[features]
attn-profile = ["sourcetrait_quest_lib/attn-profile"]
cuda = ["sourcetrait_quest_lib/cuda"]
flash-attn = ["cuda", "sourcetrait_quest_lib/flash-attn"]

[dependencies]
clap.workspace = true
ratatui.workspace = true
sourcetrait_quest_lib.workspace = true
