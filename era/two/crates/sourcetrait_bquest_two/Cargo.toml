[package]
name = "sourcetrait_bquest_two"
version = "0.0.0-17"
edition = "2024"
description = "bquest: the training, development, and testing tool"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_quest"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "quest", "bquest"]

[[bin]]
name = "bquest"
path = "src/main.rs"

[features]
# The burn oracle's fast grade (comparison-grade bf16; autotune per
# the era-one oracle posture - training builds gate it off).
burn-cuda = ["burn/cuda", "burn/autotune"]
cuda = ["sourcetrait_lib_quest_two/cuda"]
flash-attn = ["cuda", "sourcetrait_lib_quest_two/flash-attn"]
# The CptLoop trainer stage (burn autodiff over the oracle stack).
train = ["burn/autodiff"]
# Training on cuda WITHOUT autotune - the era-one lesson: autotune's
# benchmark churn at high residency kills the cubecl allocator;
# default kernel selection trades speed for a bounded pool.
train-cuda = ["train", "burn/cuda"]

[dependencies]
burn.workspace = true
candle-core.workspace = true
clap.workspace = true
half.workspace = true
regex.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
snafu.workspace = true
sourcetrait_lib_quest_two.workspace = true
tokenizers.workspace = true
unicode-normalization.workspace = true
unicode-properties.workspace = true
zstd.workspace = true
