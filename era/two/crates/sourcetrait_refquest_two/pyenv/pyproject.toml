[project]
name = "refquest-pyenv"
version = "0.0.0"
description = "The pinned python environment refquest orchestrates (the original ai2 tooling under test)"
requires-python = "==3.12.*"
dependencies = [
  "accelerate",
  "flash-linear-attention==0.5.0",
  "torch",
  "transformers==5.4.0",
  "vllm==0.19.1",
]

[tool.uv]
package = false
# vllm 0.19.1 declares transformers <5 or >5.5; ai2's open-instruct
# forces the hybrid-era 5.4.0 through the same override.
override-dependencies = ["transformers==5.4.0"]
