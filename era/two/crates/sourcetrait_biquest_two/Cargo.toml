[package]
name = "sourcetrait_biquest_two"
version = "0.0.0-3"
edition = "2024"
description = "biquest: the QuestImaginary foundation and training tool"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_quest"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "quest", "biquest"]

[[bin]]
name = "biquest"
path = "src/main.rs"

[features]
cuda = ["sourcetrait_lib_quest_llm_two/cuda"]
flash-attn = ["cuda", "sourcetrait_lib_quest_llm_two/flash-attn"]
# The trainer stages (burn autodiff over the oracle stack in the llm lib).
train = ["sourcetrait_lib_quest_llm_two/train"]
# Training on cuda WITHOUT autotune - the era-one lesson lives with the
# feature in the llm lib.
train-cuda = ["train", "sourcetrait_lib_quest_llm_two/train-cuda"]

[dependencies]
clap.workspace = true
nu-protocol.workspace = true
nuon.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
sourcetrait_lib_quest_harness_two.workspace = true
sourcetrait_lib_quest_llm_two.workspace = true
tokenizers.workspace = true
