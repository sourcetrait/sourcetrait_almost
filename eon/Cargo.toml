[workspace]
resolver = "3"
members = [
  "crates/sourcetrait_quest_core",
  "crates/sourcetrait_quest_bridge",
  # Parked while the harness and daemon are built; camp returns as the
  # second QuestHarness consumer.
  # "crates/sourcetrait_quest_camp",
]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
nu-cmd-lang = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-command = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-engine = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-parser = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-protocol = { git = "https://github.com/nushell/nushell", tag = "0.114.1", default-features = false }
nuon = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
ratatui = { version = "0.29" }
snafu = { version = "0.9" }
sourcetrait_quest_bridge = { path = "crates/sourcetrait_quest_bridge" }
sourcetrait_quest_bridge_two = { path = "../era/two/crates/sourcetrait_quest_bridge_two" }
sourcetrait_quest_core = { path = "crates/sourcetrait_quest_core" }
tokio = { version = "1", features = ["sync"] }
