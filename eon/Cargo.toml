[workspace]
resolver = "3"
members = [
  "crates/sourcetrait_quest_bridge",
  "crates/sourcetrait_dquest",
  "crates/sourcetrait_quest",
  # Parked while the harness and daemon are built; camp returns as the
  # second QuestHarness consumer.
  # "crates/sourcetrait_quest_camp",
]

[workspace.dependencies]
anstyle = { version = "1" }
bitcode = { version = "0.6" }
# Pinned at era/two's own versions: a direct dependency binds whichever
# instance matches its requirement, and these must be the instances the
# era library uses rather than a second copy beside them.
candle-core = { version = "0.11" }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
# Pinned at the estate's nushell, which is also the plugin protocol
# binding: the plugin and the era library must resolve ONE nu-protocol,
# or a Value built by the library is a different type from the one the
# plugin returns.
nu-plugin = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-protocol = { git = "https://github.com/nushell/nushell", tag = "0.114.1", default-features = false }
rand = { version = "0.9" }
ratatui = { version = "0.29" }
# Default features pull aws_lc_rs, and prefer-post-quantum pulls it again
# on its own. The estate is single-backend on ring; re-read the lock after
# touching either of these.
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = { version = "0.10" }
snafu = { version = "0.9" }
# A sibling-repository path: sourcetrait_cert is not published, so a git
# dependency does not resolve. Both repositories are clones under the
# sourcetrait projects home, so the sibling assumption is the standing
# checkout layout rather than one machine's.
sourcetrait_cert_lib = { path = "../../sourcetrait_cert/crates/sourcetrait_cert_lib" }
sourcetrait_lib_quest_two = { path = "../era/two/crates/sourcetrait_lib_quest_two" }
sourcetrait_quest_bridge = { path = "crates/sourcetrait_quest_bridge" }
sourcetrait_quest_bridge_two = { path = "../era/two/crates/sourcetrait_quest_bridge_two" }
tokenizers = { version = "0.23" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
