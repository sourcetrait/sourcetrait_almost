[package]
name = "sourcetrait_quest_camp"
version = "0.0.0-3"
edition = "2024"
description = "Campaign TUI for SourceTrait Quest"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_quest"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "quest", "camp"]

[[bin]]
name = "camp"
path = "src/main.rs"

[features]
cuda = ["sourcetrait_quest_bridge_two/cuda"]
flash-attn = ["cuda", "sourcetrait_quest_bridge_two/flash-attn"]

[dependencies]
clap.workspace = true
ratatui.workspace = true
snafu.workspace = true
sourcetrait_quest_bridge.workspace = true
sourcetrait_quest_bridge_two.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
