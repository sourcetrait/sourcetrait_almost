[package]
name = "sourcetrait_quest_camp"
version = "0.0.0-4"
edition = "2024"
description = "Campaign TUI for SourceTrait Quest"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_quest"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "quest", "camp"]

[[bin]]
name = "camp"
path = "src/main.rs"

# PARKED, and it does not build as it stands. Camp drove an era that held
# the model in its own process; the daemon holds it now, so camp returns
# as a client of the bridge transport rather than of an era crate. Its
# source still speaks the retired session vocabulary.
[dependencies]
clap.workspace = true
ratatui.workspace = true
snafu.workspace = true
sourcetrait_quest_bridge.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
